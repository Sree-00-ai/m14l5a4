<!DOCTYPE html>
<html>

<head>
    <title>Async and Await in JavaScript</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2ff;
            text-align: center;
            padding: 30px;
        }

        .container {
            background-color: white;
            max-width: 500px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px #cccccc;
        }

        h1 {
            color: #4338ca;
        }

        button {
            background-color: #4f46e5;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 8px;
            font-size: 16px;
        }

        button:hover {
            background-color: #3730a3;
        }

        #result {
            background-color: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
            white-space: pre-line;
            text-align: left;
            min-height: 50px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Async and Await</h1>

        <p>Click the button to fetch student details.</p>

        <button onclick="getStudentDetails()">
            Get Student Details
        </button>

        <button onclick="clearResult()">
            Clear
        </button>

        <p id="result">Result will appear here.</p>
    </div>

    <script>
        // STEP 1: Create a function that returns a Promise
        function fetchStudent() {

            return new Promise((resolve, reject) => {

                setTimeout(() => {

                    let success = true;

                    if (success) {
                        resolve({
                            name: "Ravi",
                            age: 15,
                            course: "JavaScript",
                            marks: 90
                        });
                    } else {
                        reject(new Error("Unable to fetch student details."));
                    }

                }, 2000);

            });
        }

        // STEP 2: Create an async function
        async function getStudentDetails() {

            let output = document.getElementById("result");

            output.style.color = "black";
            output.textContent = "Loading student details...";

            try {

                // STEP 3: Wait for the Promise to resolve
                let student = await fetchStudent();

                // STEP 4: Display the received data
                output.style.color = "green";

                output.textContent =
                    "Student Details\n\n" +
                    "Name: " + student.name + "\n" +
                    "Age: " + student.age + "\n" +
                    "Course: " + student.course + "\n" +
                    "Marks: " + student.marks;

            } catch (error) {

                // STEP 5: Handle errors
                output.style.color = "red";
                output.textContent = "Error: " + error.message;

            } finally {

                // STEP 6: Runs after success or failure
                console.log("Student request completed.");

            }
        }

        // Clear the displayed result
        function clearResult() {
            document.getElementById("result").textContent =
                "Result will appear here.";
        }
    </script>

</body>

</html>
